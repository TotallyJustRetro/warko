name: windows-exe
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: windows-latest
    defaults: { run: { shell: 'msys2 {0}' } }
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2 mingw-w64-x86_64-python make
      - name: Build ROM-independent player
        run: |
          python3 gbrecomp.py --player -o build/player
          make -C build/player OPT=-O2 -j4
          mkdir dist
          cp build/player/gbplayer.exe dist/
          cp /mingw64/bin/SDL2.dll dist/
      - uses: actions/upload-artifact@v4
        with: { name: gbplayer-windows, path: dist }
